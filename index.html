<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>hw-localstorage</title>
    <link rel="stylesheet" href="./src/style.css">
  </head>
  <body>
    <div class="card">
    <h2>Contact Book</h2>

    <form id="contact-form">
      <div class="form-group">
        <input type="text" id="name" placeholder="Ім'я" required>
      </div>
      <div class="form-group">
        <input type="text" id="surname" placeholder="Прізвище" required>
      </div>
      <div class="form-group">
        <input type="tel" id="phone" placeholder="Телефон" required>
      </div>
      <div class="form-group">
        <input type="email" id="email" placeholder="Email" required>
      </div>
      <button type="submit" id="submit-btn" class="btn-submit">Додати контакт</button>
    </form>

    <div class="contact-list" id="contact-list"></div>
  </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
